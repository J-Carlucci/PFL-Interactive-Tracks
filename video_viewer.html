<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLORYS Animation</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    .message {
      color: #fff;
      padding: 1rem;
      text-align: center;
      max-width: 720px;
      line-height: 1.4;
    }

    .message a {
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <div class="viewer">
    <video id="glorysVideo" controls autoplay playsinline webkit-playsinline></video>
    <div id="message" class="message" style="display:none;"></div>
  </div>

  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var src = params.get("src");
      var video = document.getElementById("glorysVideo");
      var message = document.getElementById("message");

      function showMessage(html){
        video.style.display = "none";
        message.style.display = "block";
        message.innerHTML = html;
      }

      if(!src){
        showMessage("No video URL was provided.");
        return;
      }

      try {
        var url = new URL(src);

        if(url.protocol !== "https:"){
          showMessage("The video URL must use HTTPS.");
          return;
        }

        video.src = src;

        video.addEventListener("loadedmetadata", function(){
          video.play().catch(function(){
            // Autoplay may be blocked. Native controls are visible, so the user can tap play.
          });
        });

        video.addEventListener("error", function(){
          showMessage(
            "The video could not be loaded.<br><br>" +
            "<a href="" + src.replace(/"/g, "&quot;") + "" target="_blank" rel="noopener">Open the source video</a>"
          );
        });

      } catch(e){
        showMessage("The video URL was not valid.");
      }
    })();
  </script>
</body>
</html>
